
<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IBAN.UNO</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#090909;color:#f7f4ed;font-family:system-ui,-apple-system,sans-serif;padding:16px}
.w{width:100%;max-width:420px}
.c{aspect-ratio:1.58;border-radius:22px;padding:24px;position:relative;background:linear-gradient(135deg,#24221c,#090909 70%);border:1px solid #d8b56d;overflow:hidden}
.t{color:#f0d69b;font-size:11px;letter-spacing:.2em;font-weight:800}
.n{position:absolute;left:24px;right:24px;bottom:46px;font-size:20px;letter-spacing:.1em;font-weight:800;text-transform:uppercase;overflow-wrap:anywhere}
.b{position:absolute;left:24px;bottom:22px;color:#d8b56d;font-size:11px;letter-spacing:.15em;text-transform:uppercase}
.i{margin-top:18px;border:1px solid rgba(216,181,109,.3);border-radius:16px;padding:18px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:18px;color:#f0d69b;word-break:break-word}
button{margin-top:12px;width:100%;padding:15px;font-size:16px;font-weight:700;border-radius:999px;border:1px solid #d8b56d;background:linear-gradient(135deg,#f0d69b,#d8b56d);color:#15120b}
button.s{background:none;color:#f0d69b}
.m{text-align:center;min-height:22px;margin-top:10px;color:#f0d69b;font-size:13px}
.e{text-align:center;color:#aaa69b}
</style>
</head>
<body>
<div class="w" id="a"></div>
<script>
const SUPABASE_URL="https://xnfungabohooyiacqquf.supabase.co";
const SUPABASE_KEY="sb_publishable_ZFKSVnGpSMy4DjbZ3_jHgA_WwMSYWRh";

const a=document.getElementById("a");
function e(t,c,x){
 const d=document.createElement(t);
 if(c)d.className=c;
 if(x!==undefined)d.textContent=x;
 return d;
}
const k=(new URLSearchParams(location.search).get("k")||"").trim().toLowerCase();

if(!/^[a-z0-9_-]{1,40}$/.test(k)){
 a.appendChild(e("p","e","IBAN.UNO - Kartını okut."));
}else{
 fetch(SUPABASE_URL+"/rest/v1/rpc/kart_goster",{
  method:"POST",
  headers:{
   "apikey":SUPABASE_KEY,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({p_kod:k})
 })
 .then(async r=>{
  if(!r.ok)throw new Error("Sunucu hatası");
  return r.json();
 })
 .then(db=>{
  const p=Array.isArray(db)?db[0]:db;
  if(!p||!p.iban){
   a.appendChild(e("p","e","Kart bulunamadı."));
   return;
  }
  const ib=String(p.iban).replace(/\s+/g,"").toUpperCase();
  const ad=String(p.ad_soyad||"");
  const banka=String(p.banka||"");

  const c=e("div","c");
  c.appendChild(e("div","t","IBAN.UNO"));
  c.appendChild(e("div","n",ad));
  c.appendChild(e("div","b",banka));
  a.appendChild(c);
  a.appendChild(e("div","i",ib.replace(/(.{4})/g,"$1 ").trim()));

  const m=e("div","m");
  async function cp(t){
   try{
    await navigator.clipboard.writeText(t);
    m.textContent="Kopyalandı ✓";
   }catch(err){
    const x=document.createElement("textarea");
    x.value=t;
    document.body.appendChild(x);
    x.select();
    const success=document.execCommand("copy");
    x.remove();
    m.textContent=success?"Kopyalandı ✓":"Kopyalanamadı";
   }
   setTimeout(()=>m.textContent="",2500);
  }
  const b1=e("button","","IBAN'ı kopyala");
  b1.onclick=()=>cp(ib);
  const b2=e("button","s","Ad soyad + IBAN'ı kopyala");
  b2.onclick=()=>cp(ad+"\n"+ib);
  a.append(b1,b2,m);
 })
 .catch(()=>{
  a.appendChild(e("p","e","Bilgiler yüklenemedi."));
 });
}
</script>
</body>
</html>
