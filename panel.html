
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBAN.UNO Yönetim</title>
<style>
body{background:#0b0b0b;color:#d4af37;font-family:Arial,sans-serif;padding:24px}
main{max-width:440px;margin:auto}
.card{background:#191919;padding:22px;border:1px solid #665522;border-radius:16px}
input,button{padding:12px;border-radius:8px;margin-top:10px;width:100%;box-sizing:border-box}
button{background:#d4af37;color:#111;border:0;font-weight:bold}
#sonuc{color:#eee;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>IBAN.UNO</h1>
<div class="card">
<h2>Yönetim Paneli</h2>
<p>Supabase bağlantı testi</p>
<input id="adres" placeholder="Supabase Project URL">
<input id="anahtar" placeholder="Publishable key">
<button onclick="testEt()">Bağlantıyı Test Et</button>
<p id="sonuc"></p>
</div>
</main>
<script>
async function testEt(){
const adres=document.getElementById("adres").value.trim().replace(/\/$/,"");
const anahtar=document.getElementById("anahtar").value.trim();
const sonuc=document.getElementById("sonuc");
if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(adres)||!anahtar.startsWith("sb_publishable_")){
sonuc.textContent="Geçerli proje adresi ve publishable key gir.";
return;
}
sonuc.textContent="Kontrol ediliyor...";
try{
const r=await fetch(adres+"/rest/v1/",{
headers:{"apikey":anahtar}
});
sonuc.textContent=r.ok?"Bağlantı başarılı!":"Bağlantı hatası: "+r.status;
}catch(e){
sonuc.textContent="Bağlantı kurulamadı: "+e.message;
}
}
</script>
</body>
</html>
