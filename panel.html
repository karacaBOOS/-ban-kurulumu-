
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBAN.UNO Yönetim</title>
<style>
body{background:#0b0b0b;color:#d4af37;font-family:Arial,sans-serif;padding:24px}
main{max-width:440px;margin:auto}
.card{background:#191919;padding:22px;border:1px solid #665522;border-radius:16px}
input,button{padding:12px;border-radius:8px;margin-top:10px;width:100%;box-sizing:border-box}
button{background:#d4af37;color:#111;border:0;font-weight:bold}
#sonuc{color:#eee;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>IBAN.UNO</h1>
<div class="card">
<h2>Yönetim Paneli</h2>
<p>Supabase bağlantı testi</p>
<input id="adres" placeholder="Supabase Project URL">
<input id="anahtar" placeholder="Publishable key">
<button onclick="testEt()">Bağlantıyı Test Et</button>
<p id="sonuc"></p>
</div>
</main>
<script>
async function testEt(){
const adres=document.getElementById("adres").value.trim().replace(/\/$/,"");
const anahtar=document.getElementById("anahtar").value.trim();
const sonuc=document.getElementById("sonuc");
if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(adres)||!anahtar.startsWith("sb_publishable_")){
sonuc.textContent="Geçerli proje adresi ve publishable key gir.";
return;
}
sonuc.textContent="Kontrol ediliyor...";
try{
const r=await fetch(adres+"/auth/v1/settings",{
headers:{"apikey":anahtar}
});
sonuc.textContent=r.ok?"Bağlantı başarılı!":"Bağlantı hatası: "+r.status;
}catch(e){
sonuc.textContent="Bağlantı kurulamadı: "+e.message;
}
}
</script>
<section id="kart-yonetimi" class="card">
  <h2>Kart Yönetimi</h2>
  <p>NFC kartlarını buradan yöneteceğiz.</p>
  <button type="button" onclick="kartlariGetir()">
    Kartları Listele
  </button>
  <p id="kart-durum"></p>
  <div id="kart-listesi"></div>
</section>

<script>
async function kartlariGetir() {
  const durum = document.getElementById("kart-durum");
  const liste = document.getElementById("kart-listesi");
  const adres = document.getElementById("adres").value.trim().replace(/\/$/, "");
  const anahtar = document.getElementById("anahtar").value.trim();

  liste.replaceChildren();

  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(adres) ||
      !anahtar.startsWith("sb_publishable_")) {
    durum.textContent = "Önce Supabase adresini ve publishable key gir.";
    return;
  }

  durum.textContent = "Kartlar kontrol ediliyor...";

  try {
    const cevap = await fetch(
      adres + "/rest/v1/kartlar?select=kart_kodu,ad_soyad&limit=20",
      { headers: { apikey: anahtar } }
    );

    if (!cevap.ok) {
      durum.textContent = "Erişim sağlanamadı: " + cevap.status;
      return;
    }

    const kartlar = await cevap.json();
    durum.textContent = kartlar.length
      ? kartlar.length + " kart bulundu."
      : "Görüntüleme yetkisi olan kart bulunamadı.";

    for (const kart of kartlar) {
      const satir = document.createElement("p");
      satir.textContent = kart.kart_kodu + " — " + kart.ad_soyad;
      liste.appendChild(satir);
    }
  } catch (hata) {
    durum.textContent = "Bağlantı hatası: " + hata.message;
  }
}
</script>
</body>
</html>
